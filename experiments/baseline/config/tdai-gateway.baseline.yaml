# Reproducible local baseline for optimization-tasks.md.
# Secrets and machine-specific paths are supplied by scripts/start-baseline.ps1.
deployMode: standalone
stateBackend: local

server:
  host: 127.0.0.1
  port: 8420

data:
  baseDir: ~/.memory-tencentdb/memory-tdai

llm:
  baseUrl: https://api.openai.com/v1
  apiKey: "${TDAI_LLM_API_KEY}"
  model: qwen3.7-plus
  maxTokens: 32000
  timeoutMs: 300000

memory:
  promptMode: code
  capture:
    enabled: true
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: hybrid
    timeoutMs: 5000
  storeBackend: sqlite
  embedding:
    provider: none
  bm25:
    enabled: true
    language: zh

skill:
  enabled: true
  routing:
    profile: static
    mode: bm25
    searchTopK: 20
    charBudgetPercent: 0.01
    adaptive:
      candidateTopK: 40
      complexityK: { simple: 4, moderate: 6, complex: 8 }
      absoluteScoreThreshold: 0.25
      relativeScoreThreshold: 0.60
      scoreGapThreshold: 0.20
      maxListingChars: 4000
      reranker:
        baseUrl: "${TDAI_SKILL_RERANK_BASE_URL}"
        model: qwen3-rerank
        timeoutMs: 5000
        failOpen: true
        apiKeyEnv: TDAI_SKILL_RERANK_API_KEY
  extraction:
    enabled: true
    trigger:
      profile: legacy # extraction-trigger
      minToolCalls: 2
      completionScoreThreshold: 0.68
      topicSwitchScoreThreshold: 0.72
    valueGate:
      profile: legacy # extraction-value-gate
    reviewPromptProfile: legacy_v2
    maxIterations: 16
    queue:
      backend: local
      keyPrefix: tdai-baseline
      resultTtlSeconds: 86400
      lockTtlMs: 600000
      maxRetries: 2
      retryBackoffsMs: [5000, 15000]
  resources:
    maxResourceSizeBytes: 5000000

observability:
  otel:
    enabled: false
  clickhouse:
    enabled: false
  kafka:
    enabled: false
  langfuse:
    enabled: false
